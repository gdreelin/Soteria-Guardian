<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">Soteria Guardian connection diagram</title>
  <desc id="desc">Hardware devices connect through local networks into Home Assistant, which runs Soteria Guardian automations and sends alert context to caregiver apps.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#516173"/>
    </marker>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity=".18"/>
    </filter>
    <style>
      .label { fill: #0f172a; font: 700 24px Arial, sans-serif; }
      .body { fill: #475569; font: 16px Arial, sans-serif; }
      .small { fill: #64748b; font: 14px Arial, sans-serif; }
      .line { fill: none; stroke: #516173; stroke-width: 4; marker-end: url(#arrow); }
      .soft-line { fill: none; stroke: #94a3b8; stroke-width: 3; stroke-dasharray: 8 8; marker-end: url(#arrow); }
      .pill { fill: #e2e8f0; }
      .pill-text { fill: #334155; font: 700 13px Arial, sans-serif; letter-spacing: .4px; }
    </style>
  </defs>

  <rect width="1400" height="720" rx="32" fill="#f8fafc"/>
  <rect x="28" y="28" width="1344" height="664" rx="28" fill="#ffffff" stroke="#d8e0ea"/>

  <text x="70" y="90" fill="#0f172a" font-family="Arial, sans-serif" font-size="34" font-weight="700">Soteria Guardian Hardware Connections</text>
  <text x="70" y="120" class="body">Local sensors and SOS controls feed Home Assistant first. The caregiver app receives the alert state, room context, and camera verification path.</text>

  <g filter="url(#cardShadow)">
    <rect x="70" y="175" width="285" height="360" rx="18" fill="#f1f5f9" stroke="#d8e0ea"/>
    <text x="95" y="220" class="label">Resident Hardware</text>

    <rect x="100" y="255" width="225" height="70" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="130" cy="290" r="15" fill="#2563eb"/>
    <text x="160" y="283" class="body" font-weight="700">Aqara Mini Button</text>
    <text x="160" y="306" class="small">SOS press events</text>

    <rect x="100" y="350" width="225" height="70" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="130" cy="385" r="15" fill="#16a34a"/>
    <text x="160" y="378" class="body" font-weight="700">Button Holder</text>
    <text x="160" y="401" class="small">Wearable or fixed mount</text>

    <rect x="100" y="445" width="225" height="70" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="130" cy="480" r="15" fill="#ea580c"/>
    <text x="160" y="473" class="body" font-weight="700">Presence Sensor FP2</text>
    <text x="160" y="496" class="small">Room zones and inactivity</text>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="470" y="185" width="270" height="145" rx="18" fill="#ecfeff" stroke="#99f6e4"/>
    <text x="500" y="230" class="label">Aqara G350</text>
    <text x="500" y="260" class="body">Indoor camera verification</text>
    <text x="500" y="285" class="small">Matter camera, local recording,</text>
    <text x="500" y="306" class="small">Zigbee and Thread hub roles</text>
    <rect x="500" y="212" width="82" height="24" rx="12" class="pill"/>
    <text x="541" y="229" text-anchor="middle" class="pill-text">CAMERA</text>

    <rect x="470" y="400" width="270" height="145" rx="18" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="500" y="445" class="label">Home Network</text>
    <text x="500" y="475" class="body">Wi-Fi, Zigbee, Matter, Thread</text>
    <text x="500" y="500" class="small">Keeps devices reachable</text>
    <text x="500" y="521" class="small">for local automations</text>
    <rect x="500" y="427" width="82" height="24" rx="12" class="pill"/>
    <text x="541" y="444" text-anchor="middle" class="pill-text">LOCAL</text>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="855" y="230" width="265" height="230" rx="20" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="885" y="280" class="label">Home Assistant</text>
    <text x="885" y="315" class="body">Control plane</text>
    <text x="885" y="345" class="small">Device entities, SOS scripts,</text>
    <text x="885" y="366" class="small">camera snapshots, escalation,</text>
    <text x="885" y="387" class="small">device health, and audit state</text>
    <rect x="885" y="262" width="128" height="24" rx="12" class="pill"/>
    <text x="949" y="279" text-anchor="middle" class="pill-text">AUTOMATION</text>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="1175" y="210" width="155" height="275" rx="24" fill="#0f172a"/>
    <rect x="1192" y="238" width="121" height="216" rx="18" fill="#f8fafc"/>
    <circle cx="1252" cy="468" r="7" fill="#94a3b8"/>
    <text x="1252" y="285" text-anchor="middle" class="body" font-weight="700">Caregiver</text>
    <text x="1252" y="312" text-anchor="middle" class="small">Soteria</text>
    <text x="1252" y="332" text-anchor="middle" class="small">Guardian app</text>
    <rect x="1210" y="360" width="84" height="34" rx="17" fill="#dc2626"/>
    <text x="1252" y="382" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="700">SOS Alert</text>
  </g>

  <path class="line" d="M355 290 C405 290, 415 255, 470 255"/>
  <text x="383" y="270" class="small">Zigbee button events</text>

  <path class="line" d="M355 480 C415 480, 420 472, 470 472"/>
  <text x="384" y="458" class="small">Wi-Fi presence zones</text>

  <path class="soft-line" d="M740 258 C800 258, 805 300, 855 305"/>
  <text x="770" y="248" class="small">snapshot and live view</text>

  <path class="line" d="M740 472 C800 472, 810 375, 855 365"/>
  <text x="770" y="438" class="small">entity state and events</text>

  <path class="line" d="M1120 345 C1145 345, 1148 345, 1175 345"/>
  <text x="1130" y="326" class="small">alerts and status</text>

  <path class="soft-line" d="M1252 210 C1252 160, 975 150, 605 185"/>
  <text x="955" y="165" class="small">secure remote access when enabled</text>

  <rect x="70" y="590" width="1260" height="58" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="95" y="624" class="body" font-weight="700">Safety boundary:</text>
  <text x="238" y="624" class="body">Soteria Guardian can assist with household alerts and caregiver visibility, but it is not a medical device or a replacement for emergency services.</text>
</svg>
