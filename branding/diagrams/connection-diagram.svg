<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Soteria Guardian connection diagram</title>
  <desc id="desc">A simplified diagram showing Aqara devices feeding Home Assistant, Soteria Guardian automations, and caregiver alerts.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L12,7 L2,12 Z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-12%" y="-16%" width="124%" height="136%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity=".16"/>
    </filter>
    <style>
      .title { fill: #0f172a; font: 700 36px Arial, sans-serif; }
      .subtitle { fill: #475569; font: 18px Arial, sans-serif; }
      .section { fill: #0f172a; font: 700 24px Arial, sans-serif; }
      .item { fill: #0f172a; font: 700 18px Arial, sans-serif; }
      .body { fill: #475569; font: 15px Arial, sans-serif; }
      .small { fill: #64748b; font: 14px Arial, sans-serif; }
      .line { fill: none; stroke: #2563eb; stroke-width: 5; marker-end: url(#arrow); }
      .note { fill: #334155; font: 700 13px Arial, sans-serif; letter-spacing: .3px; }
    </style>
  </defs>

  <rect width="1400" height="760" rx="30" fill="#f8fafc"/>
  <rect x="32" y="32" width="1336" height="696" rx="26" fill="#ffffff" stroke="#d8e0ea"/>

  <text x="70" y="92" class="title">Soteria Guardian Hardware Flow</text>
  <text x="70" y="126" class="subtitle">Simple local path: Aqara devices report into Home Assistant, Soteria Guardian evaluates the alert, and caregivers get context.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="180" width="360" height="430" rx="18" fill="#eef6ff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="105" y="225" class="section">1. Resident Devices</text>

    <rect x="105" y="260" width="295" height="74" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="135" cy="297" r="16" fill="#2563eb"/>
    <text x="165" y="291" class="item">Aqara Mini Button</text>
    <text x="165" y="314" class="body">SOS press or wearable trigger</text>

    <rect x="105" y="365" width="295" height="74" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="135" cy="402" r="16" fill="#16a34a"/>
    <text x="165" y="396" class="item">Aqara FP2</text>
    <text x="165" y="419" class="body">Presence zones and inactivity</text>

    <rect x="105" y="470" width="295" height="74" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="135" cy="507" r="16" fill="#f97316"/>
    <text x="165" y="501" class="item">Aqara G350 Camera</text>
    <text x="165" y="524" class="body">Video verification and snapshots</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="520" y="180" width="360" height="430" rx="18" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
    <text x="555" y="225" class="section">2. Local Control</text>

    <rect x="555" y="270" width="295" height="104" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="585" y="310" class="item">Home Assistant</text>
    <text x="585" y="337" class="body">Receives device entities, runs</text>
    <text x="585" y="359" class="body">automations, scripts, and states</text>

    <rect x="555" y="420" width="295" height="104" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="585" y="460" class="item">Soteria Guardian</text>
    <text x="585" y="487" class="body">Adds caregiver dashboard, alert</text>
    <text x="585" y="509" class="body">lifecycle, and safety records</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="970" y="180" width="360" height="430" rx="18" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
    <text x="1005" y="225" class="section">3. Caregiver Response</text>

    <rect x="1005" y="270" width="295" height="82" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="1035" y="306" class="item">Mobile Alert</text>
    <text x="1035" y="330" class="body">SOS, room, time, and source</text>

    <rect x="1005" y="390" width="295" height="82" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="1035" y="426" class="item">Camera Check</text>
    <text x="1035" y="450" class="body">Verify before escalating</text>

    <rect x="1005" y="510" width="295" height="82" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="1035" y="546" class="item">Acknowledge or Escalate</text>
    <text x="1035" y="570" class="body">Record action in alert history</text>
  </g>

  <path class="line" d="M430 392 C468 392, 482 392, 520 392"/>
  <rect x="446" y="352" width="98" height="28" rx="14" fill="#dbeafe"/>
  <text x="495" y="371" text-anchor="middle" class="note">local events</text>

  <path class="line" d="M880 392 C918 392, 932 392, 970 392"/>
  <rect x="894" y="352" width="112" height="28" rx="14" fill="#dbeafe"/>
  <text x="950" y="371" text-anchor="middle" class="note">alert context</text>

  <rect x="105" y="646" width="1190" height="44" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="130" y="674" class="body">Primary rule: safety-critical device events stay local first; remote app access is for caregiver visibility and response.</text>
</svg>
